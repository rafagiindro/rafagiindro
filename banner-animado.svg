<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">Rafael Gindro — Tecnologia, aprendizado e desenvolvimento</title><desc id="desc">Geometria sagrada animada, com movimento lento e mudanças de cor, cobre todo o fundo em camadas azuis, roxas e vermelhas com perspectiva. Escudo com símbolo de código em destaque à direita.</desc>
